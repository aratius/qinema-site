<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qinema — Film Screening Player for Mac</title>
<meta name="description" content="Qinema is a free macOS player for film screenings: sections, per-film fades, a standby screen, and an emergency return key. Built for small cinemas and festivals.">
<meta property="og:title" content="Qinema — Film Screening Player for Mac">
<meta property="og:description" content="Fades, sections, standby screen and one emergency key. Free for macOS.">
<meta property="og:image" content="assets/icon-512.png">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080a; --bg2:#0e0d10; --panel:#141317; --line:rgba(255,255,255,.09);
  --txt:#f4efe7; --dim:#a79f92; --mute:#6f685d;
  --gold:#e7a94d; --gold2:#ffd28a; --ember:#c4553a;
  --r:18px;
  --font:'Inter','Noto Sans JP','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Hiragino Sans','PingFang SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg);overflow-x:clip}
body{font-family:var(--font);background:var(--bg);color:var(--txt);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{width:min(1120px,100% - 40px);margin:0 auto}
section{position:relative;padding:130px 0}
h1,h2,h3{line-height:1.12;letter-spacing:-.02em;font-weight:700}
h2{font-size:clamp(32px,5vw,56px);margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:18px}
.lead{color:var(--dim);font-size:clamp(16px,1.8vw,20px);max-width:640px}
.grain{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1s steps(6) infinite}
@keyframes grain{0%{background-position:0 0}20%{background-position:-60px 40px}40%{background-position:40px -60px}60%{background-position:-40px -20px}80%{background-position:60px 60px}100%{background-position:0 0}}

/* Nav */
nav{position:fixed;top:0;left:0;right:0;z-index:40;transition:background .4s,border-color .4s,backdrop-filter .4s;border-bottom:1px solid transparent}
nav.solid{background:rgba(8,8,10,.72);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-color:var(--line)}
.nav-in{display:flex;align-items:center;gap:28px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.brand img{width:28px;height:28px;border-radius:7px}
.links{display:flex;gap:26px;margin-left:auto;font-size:14px;color:var(--dim)}
.links a:hover{color:var(--txt)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;font-size:12px}
.lang button{background:none;border:0;color:var(--dim);padding:4px 10px;border-radius:999px;cursor:pointer;font:inherit}
.lang button.on{background:var(--txt);color:#111}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;font-weight:600;font-size:15px;border:1px solid transparent;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s;font-family:inherit}
.btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1206;box-shadow:0 8px 30px rgba(231,169,77,.28)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 14px 44px rgba(231,169,77,.42)}
.btn.ghost{border-color:var(--line);color:var(--txt);background:rgba(255,255,255,.03)}
.btn.ghost:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
.btn.small{padding:9px 18px;font-size:13px}
@media(max-width:760px){.links a.hide-m{display:none}.nav-in{gap:14px}.links{gap:16px}}

/* Hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:120px 0 120px;overflow:hidden}
.beam{position:absolute;top:-10%;left:50%;width:1400px;height:1200px;transform:translateX(-50%);
  background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,rgba(255,210,138,.0) 165deg,rgba(255,210,138,.17) 180deg,rgba(255,210,138,0) 195deg,transparent 200deg);
  filter:blur(18px);animation:flicker 5s ease-in-out infinite;pointer-events:none}
.beam:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(231,169,77,.25),transparent 55%)}
@keyframes flicker{0%,100%{opacity:.85}45%{opacity:1}50%{opacity:.7}55%{opacity:1}}
.dust{position:absolute;inset:0;pointer-events:none}
.dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,220,160,.7);box-shadow:0 0 8px rgba(255,210,140,.8);animation:float linear infinite}
@keyframes float{from{transform:translateY(0) translateX(0);opacity:0}15%{opacity:.9}to{transform:translateY(-480px) translateX(40px);opacity:0}}
.hero-in{position:relative;text-align:center;z-index:2}
.hero .app-ico{width:112px;height:112px;margin:0 auto 32px;border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1),0 0 80px rgba(231,169,77,.25);animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
.hero h1{font-size:clamp(46px,9vw,112px);font-weight:800;letter-spacing:-.045em;background:linear-gradient(180deg,#fff,#cfc3b0 70%,#8f836f);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.2s .1s cubic-bezier(.2,.8,.2,1) both}
.hero .tag{font-size:clamp(18px,2.6vw,28px);color:var(--dim);margin:20px auto 40px;max-width:760px;font-weight:300;animation:rise 1.2s .25s cubic-bezier(.2,.8,.2,1) both}
.hero .tag b{color:var(--gold2);font-weight:500}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;animation:rise 1.2s .4s cubic-bezier(.2,.8,.2,1) both}
.hero .meta{margin-top:26px;font-size:13px;color:var(--mute);animation:rise 1.2s .55s both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

/* Cinematic background */
.bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 2.4s ease;filter:saturate(1.05) contrast(1.05) brightness(.7);z-index:0}
.bgvid.ready{opacity:.75}
.vig{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(8,8,10,.38) 0,rgba(8,8,10,.18) 38%,transparent 70%),linear-gradient(180deg,rgba(8,8,10,.5),transparent 22%,transparent 72%,var(--bg))}
.hero h1{filter:drop-shadow(0 4px 28px rgba(10,6,4,.55))}.hero .tag,.hero .meta{text-shadow:0 2px 18px rgba(10,6,4,.7)}.hero .tag{color:#e9dfd0}.hero .meta{color:#cbbfae}
.cine{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.bgvid{z-index:0}
.flare{position:absolute;left:0;right:0;top:46%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,200,130,.0) 20%,rgba(255,210,150,.75) 50%,rgba(255,200,130,0) 80%,transparent);filter:blur(1px);box-shadow:0 0 40px 6px rgba(255,170,90,.25);opacity:.0;animation:flare 7s ease-in-out infinite;pointer-events:none}
@keyframes flare{0%,100%{opacity:0;transform:scaleX(.3)}50%{opacity:.8;transform:scaleX(1)}}
.lbx{position:absolute;left:0;right:0;height:0;background:#000;z-index:3;animation:lbx 2.2s .2s cubic-bezier(.7,0,.2,1) forwards;pointer-events:none}
.lbx.t{top:0}.lbx.b{bottom:0}
@keyframes lbx{0%{height:50%}100%{height:0}}
.hero-in{z-index:4}
/* App mock */
.stage{position:relative;margin-top:70px;perspective:1600px;animation:rise 1.4s .6s cubic-bezier(.2,.8,.2,1) both}
.mock{margin:0 auto;width:min(980px,100%);border-radius:14px;background:#1b1a1f;border:1px solid rgba(255,255,255,.12);box-shadow:0 60px 140px rgba(0,0,0,.7),0 0 120px rgba(231,169,77,.12);transform:rotateX(9deg);transform-origin:50% 100%;text-align:left;overflow:hidden;transition:transform .2s}
.mock .bar{display:flex;gap:7px;padding:12px 14px;background:#25232a;border-bottom:1px solid rgba(255,255,255,.06);align-items:center}
.mock .bar i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.mock .bar i:nth-child(2){background:#febc2e}.mock .bar i:nth-child(3){background:#28c840}
.mock .bar span{margin-left:12px;font-size:12px;color:#9b948a}
.mock .body{display:grid;grid-template-columns:1.25fr .9fr;min-height:360px}
@media(max-width:760px){.mock .body{grid-template-columns:1fr}.mock .screen-col{display:none}}
.list{padding:18px;border-right:1px solid rgba(255,255,255,.06)}
.sec-h{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;margin:4px 0 10px}
.sec-h small{margin-left:auto;font-weight:500;color:var(--gold);border:1px solid rgba(231,169,77,.4);padding:2px 10px;border-radius:99px;font-size:11px}
.row{display:grid;grid-template-columns:56px 1fr 40px 40px 40px;gap:8px;align-items:center;font-size:12.5px;padding:9px 10px;border-radius:9px;color:#cfc8bb;position:relative}
.row .th{width:56px;height:32px;border-radius:5px;background:linear-gradient(135deg,#3a2c1b,#17120d)}
.row:nth-child(3) .th{background:linear-gradient(135deg,#1c3140,#0e1a22)}
.row:nth-child(4) .th{background:linear-gradient(135deg,#40201f,#1c0f0f)}
.row em{font-style:normal;color:#8d867a;text-align:right}
.row.now{background:rgba(231,169,77,.12);outline:1px solid rgba(231,169,77,.35)}
.row.now:after{content:"";position:absolute;left:10px;right:10px;bottom:3px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--gold) var(--p,30%),rgba(255,255,255,.1) 0);animation:prog 9s linear infinite}
@property --p{syntax:'<percentage>';inherits:false;initial-value:0%}
@keyframes prog{from{--p:0%}to{--p:100%}}
.screen-col{padding:18px;display:flex;flex-direction:column;gap:14px;background:#141317}
.screen{aspect-ratio:16/9;border-radius:8px;background:#000;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.screen .film{position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,#e9a65a,#8a3a2a 40%,#1b0f12 75%);animation:fadeLoop 9s ease-in-out infinite}
.screen .film:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 60%,rgba(0,0,0,.5))}
@keyframes fadeLoop{0%{opacity:0}18%{opacity:1}72%{opacity:1}100%{opacity:0}}
.screen .lbl{position:absolute;left:8px;bottom:6px;font-size:10px;color:#fff9;letter-spacing:.1em}
.meter{display:flex;flex-direction:column;gap:5px}
.meter div{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.meter div i{display:block;height:100%;width:60%;background:linear-gradient(90deg,#4ec96b 0,#e7d34d 70%,#e5534b);animation:lvl .9s ease-in-out infinite alternate}
.meter div:nth-child(2) i{animation-duration:1.15s;animation-delay:-.3s}
@keyframes lvl{from{width:32%}to{width:78%}}
.btnrow{display:flex;gap:8px;margin-top:auto}
.btnrow span{flex:1;text-align:center;font-size:12px;padding:8px;border-radius:8px;background:rgba(255,255,255,.07);color:#d8d1c4}
.btnrow span.go{background:var(--gold);color:#1b1206;font-weight:700}

/* Reveal */
.rv{opacity:0;transform:translateY(34px);transition:opacity 1s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.d1{transition-delay:.1s}.d2{transition-delay:.2s}.d3{transition-delay:.3s}.d4{transition-delay:.4s}

/* Fade section */
.fade-sec{background:linear-gradient(180deg,var(--bg),#050507 50%,var(--bg))}
.fade-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:70px;align-items:center}
@media(max-width:860px){.fade-grid{grid-template-columns:1fr;gap:40px}}
.theatre{aspect-ratio:16/9;border-radius:14px;background:#000;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 40px 120px rgba(231,169,77,.1)}
.theatre .a,.theatre .b{position:absolute;inset:0}
.theatre .a{background:radial-gradient(circle at 70% 35%,#f1c27a,#9b4b2c 38%,#1a0f12 72%);animation:ta 12s ease-in-out infinite}
.theatre .b{background:radial-gradient(circle at 25% 60%,#8fb6c9,#2c566b 40%,#0a1218 75%);animation:tb 12s ease-in-out infinite}
@keyframes ta{0%{opacity:0}12%{opacity:1}38%{opacity:1}48%,100%{opacity:0}}
@keyframes tb{0%,52%{opacity:0}62%{opacity:1}88%{opacity:1}100%{opacity:0}}
.theatre .cap{position:absolute;left:16px;bottom:12px;font-size:12px;letter-spacing:.14em;color:#fffa;text-transform:uppercase}
.timeline{margin-top:18px;height:46px;border-radius:10px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
.timeline .seg{position:absolute;top:8px;bottom:8px;border-radius:6px;background:linear-gradient(90deg,rgba(231,169,77,.1),rgba(231,169,77,.5),rgba(231,169,77,.1))}
.timeline .s1{left:2%;width:42%}.timeline .s2{left:54%;width:42%;background:linear-gradient(90deg,rgba(120,170,200,.1),rgba(120,170,200,.5),rgba(120,170,200,.1))}
.timeline .head{position:absolute;top:0;bottom:0;width:2px;background:var(--txt);box-shadow:0 0 12px #fff;animation:head 12s linear infinite}
@keyframes head{from{left:0}to{left:100%}}
.points{list-style:none;margin-top:28px;display:grid;gap:16px}
.points li{display:flex;gap:14px;color:var(--dim)}
.points li b{color:var(--txt);font-weight:600}
.points .dot{flex:none;width:8px;height:8px;margin-top:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold)}

/* Features */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:56px}
@media(max-width:900px){.grid3{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid3{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:var(--r);padding:30px;position:relative;overflow:hidden;transition:transform .4s,border-color .4s}
.card:hover{transform:translateY(-6px);border-color:rgba(231,169,77,.4)}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),rgba(231,169,77,.14),transparent 60%);opacity:0;transition:opacity .4s}
.card:hover:before{opacity:1}
.card .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(231,169,77,.12);color:var(--gold2);margin-bottom:20px}
.card .ic svg{width:22px;height:22px}
.card h3{font-size:19px;margin-bottom:8px;letter-spacing:-.01em}
.card p{color:var(--dim);font-size:15px}

/* Real screenshots */
.shots{display:grid;gap:28px;margin-top:48px}
.shots figure{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#111;box-shadow:0 40px 120px rgba(0,0,0,.55)}
.shots img{width:100%;height:auto}
.shots figcaption{padding:12px 18px;color:var(--dim);font-size:13px}
/* Steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:56px;counter-reset:s;position:relative}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}@media(max-width:560px){.steps{grid-template-columns:1fr}}
.step{padding:26px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg2);counter-increment:s}
.step:before{content:counter(s,decimal-leading-zero);font-size:44px;font-weight:800;letter-spacing:-.04em;background:linear-gradient(180deg,var(--gold2),transparent);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;margin-bottom:10px}
.step h3{font-size:18px;margin-bottom:6px}.step p{color:var(--dim);font-size:14.5px}

/* Numbers */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:46px 0}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr;gap:34px 10px}}
.stat b{display:block;font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:-.04em;color:var(--gold2)}
.stat span{color:var(--dim);font-size:14px}

/* Download */
.dl{background:radial-gradient(900px 500px at 50% 0%,rgba(231,169,77,.16),transparent 70%),var(--bg)}
.dl-card{margin-top:50px;border:1px solid rgba(231,169,77,.25);border-radius:28px;padding:clamp(28px,5vw,60px);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:center;box-shadow:0 40px 120px rgba(0,0,0,.5)}
@media(max-width:800px){.dl-card{grid-template-columns:1fr;text-align:center}.dl-card .app-ico{margin:0 auto}}
.dl-card .app-ico{width:150px;height:150px;border-radius:34px;box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 90px rgba(231,169,77,.28)}
.dl-card h3{font-size:32px;margin-bottom:6px}
.dl-card .sub{color:var(--dim);margin-bottom:24px}
.dl-actions{display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:800px){.dl-actions{justify-content:center}}
.spec{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;font-size:13px;color:var(--dim)}
.spec div b{display:block;color:var(--txt);font-weight:600;font-size:14px}
.sha{margin-top:18px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--mute);word-break:break-all}
.manuals{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--dim);font-size:14px}
@media(max-width:800px){.manuals{justify-content:center}}
.first{margin-top:34px;border:1px dashed var(--line);border-radius:14px;padding:20px 24px;color:var(--dim);font-size:14.5px}
.first b{color:var(--txt)}

/* FAQ */
.faq{max-width:820px;margin:50px auto 0}
details{border-bottom:1px solid var(--line);padding:22px 4px}
summary{cursor:pointer;list-style:none;font-weight:600;font-size:18px;display:flex;justify-content:space-between;gap:20px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-size:26px;line-height:1;color:var(--gold);transition:transform .3s}
details[open] summary:after{transform:rotate(45deg)}
details p{color:var(--dim);margin-top:12px;max-width:700px}

/* Legal + footer */
.legal{background:var(--bg2);padding:90px 0}
.legal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:40px}
@media(max-width:860px){.legal-grid{grid-template-columns:1fr}}
.legal h3{font-size:17px;margin-bottom:10px}
.legal p,.legal li{font-size:13.5px;color:var(--dim);margin-bottom:8px}
.legal ul{padding-left:18px}
footer{padding:46px 0 60px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
.foot{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.foot nav{position:static;display:flex;gap:20px;background:none;border:0}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<nav id="nav">
  <div class="wrap nav-in">
    <a class="brand" href="#top"><img src="assets/icon.png" alt="">Qinema</a>
    <div class="links">
      <a class="hide-m" href="#features" data-i="nav_features"></a>
      <a class="hide-m" href="#fades" data-i="nav_fades"></a>
      <a class="hide-m" href="#how" data-i="nav_how"></a>
      <a class="hide-m" href="#faq">FAQ</a>
    </div>
    <div class="lang" id="lang"><button data-l="en">EN</button><button data-l="ja">日本語</button><button data-l="zh">中文</button></div>
    <a class="btn primary small" href="#download" data-i="nav_dl"></a>
  </div>
</nav>

<header class="hero" id="top">
  <video class="bgvid" id="bgvid" autoplay muted loop playsinline preload="auto" poster="assets/hero-poster.jpg" aria-hidden="true">
    <source src="assets/hero.mp4" type="video/mp4">
  </video>
  <canvas class="cine" id="cine" aria-hidden="true"></canvas>
  <div class="vig"></div>
  <div class="lbx t"></div><div class="lbx b"></div>
  <div class="wrap hero-in">
    <img class="app-ico" src="assets/icon-512.png" alt="Qinema app icon">
    <h1>Qinema</h1>
    <p class="tag" data-i="hero_tag"></p>

const LANGS=['en','ja','zh'];
function applyLang(l){
  const i=LANGS.indexOf(l); document.documentElement.lang=l==='zh'?'zh-CN':l;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=D[e.dataset.i]; if(v) e.innerHTML=v[i];});
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  try{localStorage.setItem('qinema.lang',l)}catch(e){}
}
let saved=null; try{saved=localStorage.getItem('qinema.lang')}catch(e){}
const nav=(navigator.language||'en').toLowerCase();
applyLang(saved||(nav.startsWith('ja')?'ja':nav.startsWith('zh')?'zh':'en'));
document.getElementById('lang').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) applyLang(b.dataset.l)});

/* config → DOM */
document.getElementById('ver').textContent=CONFIG.version;
document.getElementById('dlbtn').href=CONFIG.dmg; document.getElementById('zipbtn').href=CONFIG.zip;
if(CONFIG.sha256) document.getElementById('sha').textContent='SHA-256: '+CONFIG.sha256;
document.getElementById('yr').textContent=new Date().getFullYear();
document.querySelector('[data-dl-main]').addEventListener('click',e=>{e.preventDefault();document.getElementById('download').scrollIntoView({behavior:'smooth'})});

/* nav background */
const navEl=document.getElementById('nav');
addEventListener('scroll',()=>navEl.classList.toggle('solid',scrollY>30),{passive:true});

/* reveal */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.14,rootMargin:'0px 0px -6% 0px'});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));

/* cinematic hero: a misty canyon at golden hour, drawn live with mouse parallax (no stock footage) */
(function(){
  const c=document.getElementById('cine'); if(!c) return; const ctx=c.getContext('2d');
  let W=0,H=0; const dpr=Math.min(window.devicePixelRatio||1,2);
  function size(){const r=c.getBoundingClientRect();W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  size(); addEventListener('resize',size);
  const rnd=(function(seed){return function(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}})(11);
  const L=7, ph=[]; for(let i=0;i<L;i++) ph.push([rnd()*6.28,rnd()*6.28,rnd()*6.28]);
  const fogP=[]; for(let i=0;i<46;i++) fogP.push({x:rnd(),y:.3+rnd()*.55,r:.18+rnd()*.3,v:.2+rnd()*.8,l:rnd()});
  const dust=[]; for(let i=0;i<150;i++) dust.push({x:rnd(),y:rnd(),z:rnd(),p:rnd()*6.28});
  let mx=0,my=0,tx=0,ty=0;
  addEventListener('mousemove',e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2},{passive:true});
  addEventListener('deviceorientation',e=>{if(e.gamma!=null){tx=Math.max(-1,Math.min(1,e.gamma/30));ty=Math.max(-1,Math.min(1,(e.beta-45)/30))}},{passive:true});
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mix=(a,b,t)=>a+(b-a)*t;
  function noise(u,i){return Math.sin(u*6.3+ph[i][0])*.5+Math.sin(u*13.1+ph[i][1])*.28+Math.sin(u*27+ph[i][2])*.05}
  function ridgeY(u,i){
    const t=i/(L-1), wall=Math.pow(Math.abs(u-.5)*2,1.5);
    return H*(.60+.045*i) - H*(.12+.07*i)*(.18+.82*wall) - H*(.02+.012*i)*noise(u*(2.2+i*.5),i);
  }
  function draw(t){
    mx+=(tx-mx)*.05; my+=(ty-my)*.05;
    const sunX=W*.5+mx*-30, sunY=H*.5+my*-12;
    // sky
    const sky=ctx.createLinearGradient(0,0,0,H*.75);
    sky.addColorStop(0,'#3a4a66'); sky.addColorStop(.45,'#9a7f88'); sky.addColorStop(.8,'#f0b27a'); sky.addColorStop(1,'#ffd9a0');
    ctx.globalCompositeOperation='source-over'; ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    // sun glow
    const g=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,Math.max(W,H)*.55);
    g.addColorStop(0,'rgba(255,244,214,.95)'); g.addColorStop(.12,'rgba(255,214,150,.65)'); g.addColorStop(.5,'rgba(255,170,100,.18)'); g.addColorStop(1,'rgba(255,150,90,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // god rays
    ctx.globalCompositeOperation='lighter'; ctx.save(); ctx.filter='blur(14px)';
    for(let k=0;k<7;k++){
      const ang=-Math.PI/2+(k-3)*.2+Math.sin(t*.0001+k)*.03, len=H*1.3, w=.05+.03*Math.sin(t*.0002+k*2);
      const x1=sunX+Math.cos(ang-w)*len, y1=sunY-Math.sin(-ang+w)*0+Math.sin(ang-w)*len, x2=sunX+Math.cos(ang+w)*len, y2=sunY+Math.sin(ang+w)*len;
      const rg=ctx.createLinearGradient(sunX,sunY,(x1+x2)/2,(y1+y2)/2); rg.addColorStop(0,'rgba(255,225,170,.16)'); rg.addColorStop(1,'rgba(255,225,170,0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.moveTo(sunX,sunY); ctx.lineTo(x1,y1); ctx.lineTo(x2,y2); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.globalCompositeOperation='source-over';
    // canyon layers far -> near, with fog between
    const FOG=[255,205,150], DARK=[22,20,28];
    for(let i=0;i<L;i++){
      const tt=i/(L-1), depth=.2+tt*1.2;
      const ox=mx*depth*34, oy=my*depth*14;
      const col=[mix(FOG[0],DARK[0],Math.pow(tt,.75)),mix(FOG[1],DARK[1],Math.pow(tt,.75)),mix(FOG[2],DARK[2],Math.pow(tt,.75))].map(Math.round);
      ctx.beginPath(); ctx.moveTo(-60,H+10);
      for(let x=-60;x<=W+60;x+=8){ctx.lineTo(x,ridgeY((x-ox)/W,i)+oy)}
      ctx.lineTo(W+60,H+10); ctx.closePath();
      const lg=ctx.createLinearGradient(0,H*.3,0,H);
      lg.addColorStop(0,`rgb(${col[0]},${col[1]},${col[2]})`);
      lg.addColorStop(1,`rgb(${Math.round(mix(col[0],FOG[0],.35-.3*tt))},${Math.round(mix(col[1],FOG[1],.35-.3*tt))},${Math.round(mix(col[2],FOG[2],.35-.3*tt))})`);
      ctx.fillStyle=lg; ctx.fill();
      // fog bank in front of this layer
      if(i<L-1){
        const fy=H*(.62+.045*i);
        const fg=ctx.createLinearGradient(0,fy-H*.18,0,fy+H*.12);
        fg.addColorStop(0,'rgba(255,205,150,0)'); fg.addColorStop(.55,`rgba(255,214,168,${.30-.03*i})`); fg.addColorStop(1,'rgba(255,205,150,0)');
        ctx.fillStyle=fg; ctx.fillRect(0,fy-H*.18,W,H*.3);
        // drifting wisps belonging to this depth
        for(const p of fogP){ if(Math.floor(p.l*(L-1))!==i) continue;
          const x=(((p.x+t*.000008*p.v)%1.3)-.15)*W+ox*1.4, y=p.y*H+oy, r=p.r*W*.5;
          const wg=ctx.createRadialGradient(x,y,0,x,y,r); wg.addColorStop(0,'rgba(255,222,180,.20)'); wg.addColorStop(1,'rgba(255,222,180,0)');
          ctx.fillStyle=wg; ctx.fillRect(x-r,y-r*.45,r*2,r*.9);
        }
      }
    }
    // light dust in the air
    ctx.globalCompositeOperation='lighter';
    for(const d of dust){
      const x=((d.x+Math.sin(t*.0002+d.p)*.02)*W)+mx*d.z*60, y=(((d.y-t*.000012*(.4+d.z))%1+1)%1)*H*.85+my*d.z*20;
      ctx.fillStyle='rgba(255,236,200,'+(.08+.35*d.z)*(.6+.4*Math.sin(t*.002+d.p))+')';
      ctx.beginPath(); ctx.arc(x,y,.5+1.8*d.z,0,6.283); ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
  }
  if(still){draw(4000)} else {const loop=t=>{draw(t);requestAnimationFrame(loop)};requestAnimationFrame(loop)}
})();

/* real screenshots: shown only if the files exist (assets/shot-*.png) */
(function(){
  const list=[['assets/shot-main.png','ui_c1'],['assets/shot-mixer.png','ui_c2'],['assets/shot-transport.png','ui_c3']];
  const box=document.getElementById('shots'), sec=document.getElementById('interface'); let n=0;
  list.forEach(([src,cap])=>{const im=new Image(); im.onload=()=>{
    const f=document.createElement('figure'); f.className='rv'; f.appendChild(im);
    const c=document.createElement('figcaption'); c.dataset.i=cap; f.appendChild(c); box.appendChild(f);
    sec.hidden=false; applyLang(document.documentElement.lang==='zh-CN'?'zh':document.documentElement.lang); io.observe(f); n++;};
    im.alt='Qinema screenshot'; im.src=src;});
})();
/* spotlight on cards */
document.querySelectorAll('.card').forEach(c=>c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}));
</script>
